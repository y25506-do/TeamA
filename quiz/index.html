<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <title>ゴチャマゼクイズ</title>
</head>

<body>
    
    <!-- 曲 -->
    <audio src="bgm/index.mp3" autoplay loop></audio> 

    <!-- 獲得コイン数 -->
    <div class="coins">
        <img src="img/coin.png" alt="">
        <p id="totalcoin">獲得コイン：０</p>
    </div>

    <div class="container">
    <h1>ゴチャマゼクイズ</h1>
    <p>１回１０問</p>
    
    
    <!-- スタートボタン -->
    <button class="start-btn" onclick="location.href='quiz.html'">
        スタート
    </button>
    <!-- ガチャボタン -->
    <button class="gacha-btn" onclick="location.href='gacha.html'">
        ガチャ
    </button>
    <!-- 図鑑ボタン -->
    <button class="zukan-btn" onclick="location.href='zukan.html'">
        ずかん
    </button>
    <!-- データ削除ボタン -->
    <button class="delete-btn" onclick="resetcoin()">
      データ削除
    </button>
    
    </div>

    <!-- js -->
    <script src="common.js"></script>
    <script src="index.js"></script>
</body>
</html>

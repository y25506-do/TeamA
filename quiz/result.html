<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/result.css">
    <title>ゴチャマゼクイズ</title>
</head>
<body class="result-page">

    <!-- 曲 -->
    <audio id="bgm" src="bgm/result.mp3" autoplay loop></audio> 

    <!--BGMミュートボタン追加-->
    <button class="mute-btn" id="muteBtn" type="button" aria-label="BGMのミュート切り替え" title="BGM ON/OFF">
        ♪
    </button>

    <!-- 獲得コイン数 -->
    <div class="coins">
        <img src="img/coin.png" alt="">
        <p id="totalcoin">獲得コイン：０</p>
    </div>

    <!-- 結果表示エリア -->
    <div id="result">
        <p id="finish">Finish!!</h1>
        <p id="comment1">あなたのスコアは○問正解です</p>
        <p id="comment2">おめでとう</p>
    </div>

    <!-- ホームボタン -->
    <button class="home-btn" onclick="location.href='index.html'">
        ホームに戻る
    </button>

    <!-- js -->
    <script src="common.js"></script>
    <script src="result.js"></script>

    <script>
        // ============================================================
        // BGM ミュート
        // ============================================================
        const bgm     = document.getElementById('bgm');
        const muteBtn = document.getElementById('muteBtn');

        let isMuted = false;
        applyMute();

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            localStorage.setItem('bgmMuted', isMuted);
            applyMute();
        });

        function applyMute() {
            bgm.muted      = isMuted;
            muteBtn.textContent = isMuted ? '×' : '♪';
        }
    </script>
</body>
</html>

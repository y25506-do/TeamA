<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/gacha.css">
    <title>ゴチャマゼクイズ</title>
</head>
<body class="gacha-page">

    <!-- 曲 -->
    <audio id="bgm" src="bgm/gacha.mp3" autoplay loop></audio> 

    <!--BGMミュートボタン追加-->
    <button class="mute-btn" id="muteBtn" type="button" aria-label="BGMのミュート切り替え" title="BGM ON/OFF">
        ♪
    </button>

    <!-- 獲得コイン数 -->
    <div class="coins">
        <img src="img/coin.png" alt="">
        <p id="totalcoin">獲得コイン：０</p>
    </div>

    <p id="setumei">１回１０コイン</p>
    
    <!-- ガチャボタン -->
    <button id="gacha-btn2">ガチャを回す</button>
  
    <!-- 結果表示エリア -->
  <div id="resultBox">
    <div id="itemDisplay">
      <p class="result-title">獲得アイテム</p>

      <img id="resultImg" class="result-img" src="" alt="" />

      <p id="resultName" class="result-name">（ここに名前）</p>

      <p id="resultError" class="result-error" hidden>
        ※画像が見つかりません
      </p>
    </div>
  </div>

    <!-- ホームボタン -->
    <button class="home-btn" onclick="location.href='index.html'">
        ホームに戻る
    </button>

    <!-- js -->
    <script src="common.js"></script>
    <script src="gacha.js"></script>
</body>
</html>

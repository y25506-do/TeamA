<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
     <link rel="stylesheet" href="css/quiz.css">
    <title>クイズ</title>
</head>
<body class="quiz-page">
    
    <!-- 曲 -->
    <audio src="bgm/quiz.mp3" autoplay loop></audio> 

    <!-- 残り時間 -->
    <div id="timer-container">  
        <span id="timer-text">残り時間</span>
        <span id="timer-label">20</span>
        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>
    </div>

    <!-- 問題文 -->
    <div id="quiz">
        <p id="number">問題1</p>
        <h1 id="explanation">問題文表示</h3>
        <p id="hint">ヒント</p>
    </div>

    <!-- 選択肢 -->
        <div class="button-area">
            <button type="button" id="button1">1</button>
            <button type="button" id="button2">2</button>
            <button type="button" id="button3">3</button>
        </div>

    <!-- ホームボタン -->
        <button class="home-btn" onclick="location.href='index.html'">
            ホームに戻る
        </button>

    <!-- js -->
    <script src="common.js"></script>
    <script src="quiz.js"></script>

</body>
</html>
